name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: publish
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"

      - name: publish
        run: |
          ./scripts/publish.sh
